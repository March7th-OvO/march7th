# 星穹铁道章节轨道：SR 是 Star Rail 的缩写；displayId/label 为页面显示文案。
# 各目的地并不全是星球；x 严格递增，type 为 start/mission/end。

# 故事起点：六相冰，位于序幕之前。
station.SR-PRE-1.type=start
station.SR-PRE-1.x=520
station.SR-PRE-1.displayId=六相冰
station.SR-PRE-1.label=故事开始之前

# 序幕：空间站「黑塔」是环绕湛蓝星运行的空间站。
station.SR-ST-1.type=mission
station.SR-ST-1.x=2050
station.SR-ST-1.displayId=序幕
station.SR-ST-1.label=空间站「黑塔」

# 第一幕：雅利洛-Ⅵ是真正意义上的行星。
station.SR-1.type=mission
station.SR-1.x=3580
station.SR-1.displayId=第一幕
station.SR-1.label=雅利洛-Ⅵ

# 第二幕：仙舟「罗浮」是仙舟联盟的巨型宇宙舰船，并非星球。
station.SR-2.type=mission
station.SR-2.x=5110
station.SR-2.displayId=第二幕
station.SR-2.label=仙舟「罗浮」

# 第三幕：匹诺康尼作为一个世界或目的地呈现。
station.SR-3.type=mission
station.SR-3.x=6640
station.SR-3.displayId=第三幕
station.SR-3.label=匹诺康尼

# 第四幕：翁法罗斯是主线第四幕的「永恒之地」。
station.SR-4.type=mission
station.SR-4.x=8170
station.SR-4.displayId=第四幕
station.SR-4.label=翁法罗斯

# 第五幕：二相乐园实际所在的天体名为「哈托彼亚」。
station.SR-ST-2.type=end
station.SR-ST-2.x=9700
station.SR-ST-2.displayId=第五幕
station.SR-ST-2.label=二相乐园
