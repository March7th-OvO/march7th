# 所有尺寸使用设计坐标，Stage 统一 contain 缩放。修改后刷新页面生效。
# 必填键缺失、非法数字、越界值、时间倒序均报出具体键名。
# WORLD_DISTANCE = worldWidth - referenceWidth；scrollDistance 单位为浏览器 CSS px。
layout.referenceWidth=1280
layout.referenceHeight=576
layout.worldWidth=11200
layout.scrollDistance=9800
layout.safeArea=24
layout.railY=0.58
layout.walkerY=0.84
layout.walkerStartX=0.12
layout.walkerEndX=0.22
# 各层绝对位移 = -WORLD_DISTANCE * progress * factor；HUD 固定为 0。
parallax.far=0.35
parallax.background=0.60
parallax.typography=0.80
parallax.hero=0.80
parallax.rail=1.00
parallax.foreground=1.25
parallax.extreme=1.45
# 参考视频时间只定义坐标，不自动播放；milestone 严格递增，END 等于 duration。
timeline.duration=23.38
timeline.START=0
timeline.CARDS_START=0.95
timeline.CARDS_EXPAND=1.55
timeline.PANORAMA_START=4.6
timeline.PANORAMA_MAIN=7
timeline.HALO_ENTER=11.55
timeline.THE_WILL_ENTER=13.45
timeline.GREEN_IRIS_START=13.65
timeline.GREEN_IRIS_END=15.05
timeline.CYAN_TRANSITION_START=15.65
timeline.MEMORY_SCENE_READY=17.4
timeline.CYAN_FLASH_START=19.4
timeline.CYAN_FLASH_END=20.8
timeline.END=23.38
# 卡片 duration = CARDS_EXPAND - CARDS_START；stagger 单位为时间轴秒。
motion.cardScaleY=0.35
motion.cardY=-25
motion.cardStagger=0.42
# 章节背景大字从上方向下入场；duration 使用时间轴秒，并随滚动正反向播放。
# viewportX 是标题开始入场时其左缘所在的画面宽度比例。
motion.chapterTitleY=-120
motion.chapterTitleDuration=0.9
motion.chapterTitleViewportX=0.78
motion.panoramaY=55
motion.haloScale=0.72
# 转场使用低对比度色层。opacity 范围 0–0.3，不将主体完全遮住。
# fadeRatio 为各自入场/退场占总时长的比例（0.1–0.5）；时间轴秒仍随滚动速度变化。
motion.transitionFadeRatio=0.4
motion.irisOpacity=0.14
motion.cyanOpacity=0.16
# Iris 圆心为设计面比例；半径乘以设计面对角线。
# aperture 提前打开（0–0.9，须早于 coverRatio），不等待整屏填满再挖孔。
motion.irisCoverRatio=0.5
motion.irisApertureStartRatio=0.16
motion.irisX=0.50
motion.irisY=0.50
motion.irisRadius=1.0
# Cyan 半径以参考宽度为单位；圆心以设计面比例为单位。
motion.cyanRadius=0.90
motion.cyanX=0.85
motion.cyanY=0.50
motion.revealStartRatio=0
motion.revealRadius=75
# 装饰瞬闪默认关闭。需要时可显式打开低对比度慢弧光。
# opacity 0–0.15；strokeRatio 0.01–0.1，为半径比例；peakRatio 0.1–0.9。
motion.flashEnabled=false
motion.flashOpacity=0.08
motion.flashStrokeRatio=0.035
motion.flashPeakRatio=0.5
motion.flashRadius=0.65
# 默认生产关闭 Debug；开发模式自动显示，生产也可通过此开关显式打开。
debug.enabled=false
color.background=#050a17
color.far=#071329
color.hero=#008ad8
color.green=#64866b
color.transitionCyan=#497584
color.cyan=#69c5f4
