# 横向旅途：公开配置，禁止填写密钥。修改后刷新页面即可读取最新内容。
# 首屏预渲染使用构建时的同一份配置；读取失败时保留构建快照。
scene.title=沿着星轨，把回忆展开。
scene.eyebrow=MARCH 7TH / MEMORY ATLAS
scene.instruction=向下滚动，向前探索
scene.endLabel=下一站，继续同行
scene.background=#4d6bff
scene.ink=#12131a
scene.accent=#d4c1ff
# 图层速度必须依次递增，内容层固定为 1；禁止负值。
motion.far=0.3
motion.mid=0.6
motion.near=1.3
# 显影距离（像素），缩放（0.5–1），入场时长（秒）。
motion.revealY=40
motion.revealScale=0.95
motion.revealDuration=0.65
# 漂浮/旋转周期（秒），角色步行周期（秒）。
motion.floatDuration=7
motion.rotateDuration=50
motion.walkDuration=0.5
# 装饰数量（1–24），首节点相对视口位置（0.14–0.2）。
scene.decorCount=14
scene.playerX=0.17
# 节点位置以视口宽度为单位，必须递增、相邻间距至少 0.85，且第一项为 0。
# memory 为纪念站叙事文案，并非游戏原文台词。

stage.1.position=0
stage.1.place=六相冰
stage.1.title=被列车捡到的那一天
stage.1.text=星穹列车在寂静宇宙中发现了一块漂流的六相冰。冰里的少女忘记了姓名与来处，于是把重获新生的日期，写成了自己的名字。
stage.1.memory=三月七。先记住今天，昨天以后再说。
stage.1.symbol=冰
stage.1.tone=ice

stage.2.position=0.94
stage.2.place=黑塔空间站
stage.2.title=第一次成为你的向导
stage.2.text=反物质军团突袭空间站，她和丹恒在混乱中找到了刚刚醒来的开拓者。这里既是故事的序章，也是列车新同伴第一次并肩作战的地方。
stage.2.memory=站稳啦，接下来就跟紧本姑娘。
stage.2.symbol=序
stage.2.tone=station

stage.3.position=2.02
stage.3.place=贝洛伯格
stage.3.title=把风雪留在相片里
stage.3.text=在被永冬包围的雅利洛-VI，三月七与同伴穿过上下层区，见证贝洛伯格重新选择未来。雪原很冷，但这趟开拓之旅第一次有了家的温度。
stage.3.memory=这么大的雪，当然要多拍几张。
stage.3.symbol=雪
stage.3.tone=belobog

stage.4.position=2.98
stage.4.place=仙舟「罗浮」
stage.4.title=云海之外，也有旧梦
stage.4.text=列车因一封讯息驶向仙舟，在星核危机与幻胧之乱中和罗浮并肩。后来，她又在这里追索自己的记忆、拜师习剑，把未知练成了新的招式。
stage.4.memory=过去没想起来，剑倒是学会了。
stage.4.symbol=剑
stage.4.tone=luofu

stage.5.position=4.07
stage.5.place=匹诺康尼
stage.5.title=美梦也要按下快门
stage.5.text=盛会之星的邀请，把列车带进层层梦境。三月七与伙伴追随钟表匠留下的路，在真假交叠的美梦中，见证匹诺康尼重新听见自由的声音。
stage.5.memory=美梦终会醒，但照片里的大家不会消失。
stage.5.symbol=梦
stage.5.tone=penacony

stage.6.position=5.03
stage.6.place=翁法洛斯
stage.6.title=记忆终于追上了她
stage.6.text=列车抵达永恒之地门外，三月七却因突如其来的异变暂别同行者。六相冰、长夜与被封存的往事在这里重新相遇，她的故事翻到了最接近答案的一页。
stage.6.memory=无论记起什么，我都还是我。
stage.6.symbol=夜
stage.6.tone=amphoreus

stage.7.position=6.1
stage.7.place=下一站
stage.7.title=三月七的旅途还在继续~
stage.7.text=相机里还有空白，星轨前方也还有无数没有抵达的世界。答案不必在今天全部找到——只要列车继续前进，新的回忆就会不断显影。
stage.7.memory=准备好了吗？这次也要一起拍。
stage.7.symbol=∞
stage.7.tone=future
