<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="march7th.moe is currently under construction.">
<title>march7th.moe · Under Construction</title>
<style>
  :root{
    --ink:#253044;
    --muted:#7a8798;
    --blue:#6fc3e8;
    --pink:#f3a6c8;
    --line:rgba(80,110,140,.14);
    --glass:rgba(255,255,255,.78);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    padding:24px;
    background:
      radial-gradient(900px 560px at 8% 10%,rgba(243,166,200,.40),transparent 62%),
      radial-gradient(900px 620px at 92% 88%,rgba(111,195,232,.38),transparent 62%),
      linear-gradient(155deg,#fff9fc 0%,#f6f9fd 46%,#f3f9fc 100%);
  }
  .shell{width:min(720px,100%)}
  .card{
    position:relative;
    overflow:hidden;
    padding:46px 48px 34px;
    border:1px solid rgba(255,255,255,.95);
    border-radius:30px;
    background:var(--glass);
    box-shadow:0 30px 80px -32px rgba(62,90,126,.30),inset 0 1px 0 rgba(255,255,255,.85);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0 0 auto 0;
    height:4px;
    background:linear-gradient(90deg,var(--blue),#b8b6ee,var(--pink));
  }
  .topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:42px}
  .domain{font-size:14px;font-weight:600;letter-spacing:.16em;color:#5e6d81}
  .status{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 12px;border:1px solid rgba(111,195,232,.22);border-radius:999px;
    font-size:12px;color:#63819a;background:rgba(247,252,255,.72)
  }
  .dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--pink));box-shadow:0 0 0 4px rgba(111,195,232,.10)}
  .eyebrow{margin-bottom:12px;font-size:13px;font-weight:600;letter-spacing:.12em;color:#8a94a3;text-transform:uppercase}
  h1{
    font-size:clamp(36px,8vw,58px);
    line-height:1.08;
    letter-spacing:-.04em;
    margin-bottom:18px;
    background:linear-gradient(120deg,#52acd3 6%,#8a9de0 48%,#dc8ab2 92%);
    -webkit-background-clip:text;background-clip:text;color:transparent
  }
  .lead{max-width:590px;color:var(--muted);font-size:15px;line-height:1.85}
  .divider{height:1px;margin:34px 0 26px;background:linear-gradient(90deg,transparent,var(--line) 12%,var(--line) 88%,transparent)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .item{padding:17px 18px;border:1px solid rgba(98,125,153,.11);border-radius:18px;background:rgba(255,255,255,.52)}
  .label{display:block;margin-bottom:7px;font-size:11px;letter-spacing:.12em;color:#98a2b0;text-transform:uppercase}
  .value{color:#425267;font-size:14px;font-weight:600;overflow-wrap:anywhere}
  a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}
  .signature{margin-top:28px;text-align:right;color:#66758a;font-size:14px;font-weight:600}
  .copyright{margin-top:22px;padding-top:18px;border-top:1px solid rgba(80,110,140,.10);text-align:center;color:#9aa4b2;font-size:12px;letter-spacing:.02em}
  @media(max-width:620px){
    body{padding:16px}.card{padding:38px 24px 28px;border-radius:24px}.topline{margin-bottom:32px;align-items:flex-start;flex-direction:column}.meta{grid-template-columns:1fr}
  }
</style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="page-title">
      <div class="topline">
        <p class="domain">march7th.moe</p>
        <span class="status"><span class="dot"></span> Under Construction</span>
      </div>

      <p class="eyebrow">Coming Soon</p>
      <h1 id="page-title">march7th.moe</h1>
      <p class="lead">这个网站还在施工中。域名已经就位，正式内容将在准备完成后上线。</p>

      <div class="divider"></div>

      <div class="meta">
        <div class="item">
          <span class="label">Contact</span>
          <a class="value" href="mailto:hutao7758520@gmail.com">hutao7758520@gmail.com</a>
        </div>
        <div class="item">
          <span class="label">Status</span>
          <span class="value">正在施工中</span>
        </div>
      </div>

      <p class="signature">— 胡小桃 · HuXiaotao</p>
      <footer class="copyright">© 2026 HuXiaotao. All Rights Reserved.</footer>
    </section>
  </main>
</body>
</html>
