<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>March7th</title>
<style>
  :root{ --ink:#2c3a4b; --muted:#7a8797; --blue:#6fc3e8; --pink:#f3a6c8; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",-apple-system,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% 10%, rgba(243,166,200,.35), transparent 60%),
      radial-gradient(1000px 700px at 85% 90%, rgba(111,195,232,.35), transparent 60%),
      linear-gradient(160deg,#fdf6f9,#f2f8fc);
    color:var(--ink);
    padding:24px;
  }
  .card{
    text-align:center;
    max-width:560px;
    padding:56px 48px;
    background:rgba(255,255,255,.72);
    border:1px solid rgba(255,255,255,.9);
    border-radius:24px;
    box-shadow:0 24px 60px -20px rgba(80,110,140,.25);
    backdrop-filter:blur(8px);
  }
  .domain{ font-size:15px; letter-spacing:.14em; color:var(--muted); margin-bottom:18px; }
  h1{
    font-size:34px; font-weight:700; letter-spacing:.02em;
    background:linear-gradient(120deg,var(--blue),var(--pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:14px;
  }
  .divider{ width:48px; height:3px; margin:26px auto; border-radius:2px; background:linear-gradient(90deg,var(--blue),var(--pink)); }
  .sub{ font-size:15px; color:var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <p class="domain">march7th.moe</p>
    <h1>你是不是觉得我傻了吧唧的？</h1>
    <div class="divider"></div>
    <p class="sub">正在施工中</p>
  </main>
</body>
</html>
